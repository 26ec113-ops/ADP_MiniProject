<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dino World</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body { background: #e8f5d0; color: #222; }

.container {
    display: grid;
    grid-template-areas:
        "header header"
        "content sidebar"
        "footer footer";
    grid-template-columns: 2fr 1fr;
    gap: 10px;
    padding: 10px;
}
.header  { grid-area: header;  background: #3d7a37; color: white; padding: 30px; text-align: center; font-size: 28px; }
.content { grid-area: content; background: white;   padding: 20px; }
.sidebar { grid-area: sidebar; background: #f4a259; padding: 20px; }
.footer  { grid-area: footer;  background: #333;    color: white; padding: 15px; text-align: center; }

@media (max-width: 768px) {
    .container {
        grid-template-areas: "header" "content" "sidebar" "footer";
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">🦖 Dino World</div>

    <div class="content">
        <h2>Welcome!</h2>
        <p>Dinosaurs ruled the Earth from about 252 to 66 million years ago.</p>
        <p>Birds are their living descendants.</p>
    </div>

    <div class="sidebar">
        <h3>Species</h3>
        <p>T. rex<br>Triceratops<br>Velociraptor<br>Stegosaurus</p>
    </div>

    <div class="footer">© 2026 Dino World</div>
</div>
</body>
</html>
